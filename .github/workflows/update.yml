name: Update Proton CachyOS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *" # daily: bump proton-cachyos sources
    - cron: "0 6 * * 0" # weekly: bump flake.lock and keep workflows alive

permissions:
  contents: write
  actions: write

jobs:
  update-sources:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 5 * * *'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run nvfetcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix shell nixpkgs#nvfetcher -c nvfetcher -o pkgs/_sources

      - name: Validate builds
        run: |
          nix build .#proton-cachyos .#proton-cachyos-x86_64-v3
          nix flake check

      - name: Commit source updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(deps): update proton-cachyos sources"
          file_pattern: "nvfetcher.toml pkgs/_sources/*"

  update-lockfile:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 0'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update flake.lock
        run: nix flake update

      - name: Validate builds
        run: |
          nix build .#proton-cachyos .#proton-cachyos-x86_64-v3
          nix flake check

      - name: Commit lockfile update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(deps): update flake.lock"
          file_pattern: "flake.lock"

      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable update.yml